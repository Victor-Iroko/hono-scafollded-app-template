name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:unit
      - name: openapi.json matches the code
        run: |
          bun run openapi:generate
          git diff --exit-code -- openapi.json
      - name: Migrations match the schema
        env:
          DATABASE_URL: postgres://unused@localhost/unused
        run: |
          bunx drizzle-kit check
          bunx drizzle-kit generate
          test -z "$(git status --porcelain src/db/migrations)" || {
            echo "Schema changed without a migration: run bun run db:generate"; exit 1; }
      - name: Dependency audit
        run: bun audit --audit-level=high

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same ports and credentials as docker-compose.test.yml, so tests/support/config.ts needs no overrides.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis/redis-stack:7.4.0-v1
        env:
          REDIS_ARGS: "--save '' --appendonly no --requirepass redis"
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli -a redis ping"
          --health-interval 2s --health-timeout 5s --health-retries 20
      s3mock:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: app-bucket-test
        ports: ["9090:9090"]
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ["1026:1025", "8026:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - name: Wait for S3Mock
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:9090/ >/dev/null && exit 0; sleep 2; done
          exit 1
      - run: bun run test:integration

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
