# Local telemetry: app -> OTel collector -> Grafana LGTM (Tempo traces, Loki logs,
# Prometheus metrics). Start it, then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# and open Grafana at http://localhost:3001.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/collector.yml"]
    volumes:
      - ./observability:/etc/otel:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000" # Grafana UI (anonymous admin, local use only)
