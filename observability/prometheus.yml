global:
  scrape_interval: 15s

scrape_configs:
  - job_name: hono-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
    # If METRICS_TOKEN is set on the app, add:
    # authorization:
    #   credentials: <METRICS_TOKEN>

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
